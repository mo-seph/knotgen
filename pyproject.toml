[project]
name = "knotgen"
version = "0.1.0"
description = "Generate mathematical knots as closed 3D curves for Fusion 360 (knot lamps)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
identify = [
    # pyknotid on PyPI is broken on modern numpy; install from git if wanted:
    #   uv pip install "git+https://github.com/SPOCKnots/pyknotid"
]

[project.scripts]
knotgen = "knotgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knotgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
